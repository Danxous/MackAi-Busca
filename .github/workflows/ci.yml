name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mackai
          POSTGRES_PASSWORD: mackai
          POSTGRES_DB: busca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mackai -d busca_test"
          --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://mackai:mackai@localhost:5432/busca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs
      - name: Contrato OpenAPI atualizado
        run: |
          python scripts/exportar_openapi.py
          git diff --exit-code contracts/

  # Monta a imagem em todo push e PR. Na main, publica em ghcr.io/<dono>/mackai-busca,
  # de onde o Container App puxa (o ACR Tasks é bloqueado na assinatura de estudante).
  imagem:
    runs-on: ubuntu-latest
    needs: [testes]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o historico_git.txt precisa dos commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base de conhecimento (fontes.json)
        run: python scripts/preparar_conhecimento.py
        env:
          GIT_TOKEN: ${{ secrets.CONHECIMENTO_GIT_TOKEN }}  # opcional, só para repositórios privados
      - name: Nome da imagem
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mackai-busca" >> "$GITHUB_ENV"
      # O label liga o pacote do ghcr.io a este repositório; sem ele o GITHUB_TOKEN pode não ter
      # permissão de escrita no pacote e o push termina em "denied".
      - run: >-
          docker build -t "$IMAGEM:${GITHUB_SHA::7}" -t "$IMAGEM:latest"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" .
      - name: Publicar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGEM:${GITHUB_SHA::7}"
          docker push "$IMAGEM:latest"
